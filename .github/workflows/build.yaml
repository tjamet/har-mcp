name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zot.jamet.me/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ZOT_USERNAME/ZOT_PASSWORD are Gitea org-level secrets.
      - name: Login to zot
        uses: docker/login-action@v3
        with:
          registry: zot.jamet.me
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_REGISTRY=zot.jamet.me/docker-hub
          # No cache-from/to type=gha: the runner has no cache backend.
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
